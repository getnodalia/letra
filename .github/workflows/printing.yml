# Exercise the native print host and all UI tests on PRs; the broad FreeBSD/ARM64 gates
# stay on their existing nightly/release schedule.
name: Printing

on:
  pull_request:
    paths:
      - 'Cargo*'
      - 'nodalia-i18n.rev'
      - 'apps/letra/**'
      - 'apps/letra-web/**'
      - 'crates/ui-egui/**'
      - '.github/workflows/printing.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo*'
      - 'nodalia-i18n.rev'
      - 'apps/letra/**'
      - 'apps/letra-web/**'
      - 'crates/ui-egui/**'
      - '.github/workflows/printing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: printing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Print (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The interface catalogs and nodalia-proof's Language data come from nodalia-i18n at the commit in
      # nodalia-i18n.rev, so these tests build with the same data as the gate (ci.yml).
      - name: Read the nodalia-i18n pin
        id: i18n
        shell: bash
        run: echo "rev=$(tr -d '[:space:]' < nodalia-i18n.rev)" >> "$GITHUB_OUTPUT"
      - name: Check out nodalia-i18n
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: getnodalia/foundation # nodalia/i18n
          ref: ${{ steps.i18n.outputs.rev }}
          path: nodalia-i18n
          persist-credentials: false
      - name: Build with nodalia-i18n
        shell: bash
        run: |
          echo "NODALIA_I18N_DIR=$GITHUB_WORKSPACE/nodalia-i18n" >> "$GITHUB_ENV"
          echo "NODALIA_I18N_REQUIRED=1" >> "$GITHUB_ENV"

      # The catalogs include CJK interface languages, so the UI tests need the suite's fonts, as in
      # the gate (same commit as ci.yml and release.yml).
      - name: Check out nodalia-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: getnodalia/foundation # nodalia/fonts
          ref: d4f57e6b31d7c7526b539f7aaaa07312c9908bb8
          path: nodalia-fonts
          persist-credentials: false

      - name: Build with nodalia-fonts
        shell: bash
        run: |
          echo "NODALIA_FONTS_DIR=$GITHUB_WORKSPACE/nodalia-fonts" >> "$GITHUB_ENV"
          echo "NODALIA_FONTS_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Install Linux build and software-rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Native app and UI Clippy
        run: cargo clippy -p letra -p letra-ui-egui --all-targets --locked -- -D warnings

      - name: Native app and UI tests
        run: cargo test -p letra -p letra-ui-egui --locked

      - name: Browser compatibility
        if: runner.os == 'Linux'
        run: cargo check -p letra-web --target wasm32-unknown-unknown --locked
