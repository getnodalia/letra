[package]
name = "letra-web"
description = "Letra in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "letra-web"
path = "src/main.rs"

[dependencies]
letra-engine = { workspace = true }
letra-ui-egui = { workspace = true }
# The host messages (getnodalia/foundation (vendor/nodalia-libs)): one contract and one bridge for the web builds.
# The page command API (storytold/craft-libs#413): window.letra over the control channel.
nodalia-web-api = { git = "https://github.com/getnodalia/foundation", rev = "a5ba368c1313d208fe927b5bbdf06bddf38b1b2f", version = "0.1.0" }
nodalia-web-host = { git = "https://github.com/getnodalia/foundation", rev = "a5ba368c1313d208fe927b5bbdf06bddf38b1b2f", version = "0.1.0" }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
letra-doc = { workspace = true }
letra-fonts = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlIFrameElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Event", "EventTarget", "BeforeUnloadEvent", "ClipboardEvent", "DataTransfer", "FileList", "File", "DomStringList", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "MediaQueryList", "Storage", "MessageEvent", "UrlSearchParams", "CustomEvent", "CustomEventInit"] }
