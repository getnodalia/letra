[package]
name = "letra-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Letra document model: stories, paragraphs, runs, tables, sections, styles, numbering, fields, notes, comments, revisions; edit primitives"

[lints]
workspace = true

[features]
# Test inputs other crates' tests share (`cfb_guard::repeating_difat_sample`,
# `zip_guard::zip64_entry_count_sample`) and the step count of
# `work::count`; turned on only as a dev-dependency, so never built into
# the app.
test-support = ["nodalia-zip/test-support"]

[dependencies]
nodalia-codepage = { workspace = true }
letra-geom = { workspace = true }
nodalia-zip = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
nodalia-zip = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
