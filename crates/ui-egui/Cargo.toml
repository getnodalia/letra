[package]
name = "letra-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Letra egui front end (Word-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
nodalia-ui = { git = "https://github.com/getnodalia/foundation", rev = "cc4a0d8d7e54ccbc4de8858d813129011336eaad" }
# Interface translations: lookup, fallback, plurals and system-locale matching over the nodalia-i18n
# catalogs that `build.rs` embeds from `NODALIA_I18N_DIR` (getnodalia/foundation (vendor/nodalia-i18n), pinned in
# `nodalia-i18n.rev`). Same nodalia-libs rev as nodalia-ui; it brings lazy per-locale parsing
# (#247), ICU4X plural rules and bidi isolates around inserted values.
nodalia-i18n = { git = "https://github.com/getnodalia/foundation", rev = "cc4a0d8d7e54ccbc4de8858d813129011336eaad" }
nodalia-theme = { workspace = true }
# One native window per open document: the window list, the Window menu and the egui viewports.
nodalia-window = { git = "https://github.com/getnodalia/foundation", rev = "cc4a0d8d7e54ccbc4de8858d813129011336eaad", features = ["egui"] }
letra-geom = { workspace = true, features = ["image"] }
letra-doc = { workspace = true }
letra-fonts = { workspace = true }
letra-layout = { workspace = true }
letra-render = { workspace = true }
letra-engine = { workspace = true }
letra-zotero = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_extras = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
# Pictures pasted from the system clipboard arrive as pixels and are inserted as PNG (#45).
image = { workspace = true }
# The system's preferred interface languages (#8) and region (#838). Native: OS APIs; wasm:
# the browser's languages (`js`).
sys-locale = { version = "0.3", features = ["js"] }

# Linux only, where winit reports no system theme: the desktop portal's light/dark answer (see
# `desktop_theme.rs`). Already in the tree, with these features, through egui's own accessibility
# bus; pinned to one version so nothing is built twice.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

# Comment times in the user's own time zone (`local_time.rs`); the web app asks the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
nodalia-update = { workspace = true }
# The AI assistant chat: one shared component for the Office apps (nodalia-design, packages/assistant).
# Native only: it talks to the provider the person chose over HTTPS and keeps the key in the OS keychain.
nodalia-assistant = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32).
js-sys = "0.3"

[dev-dependencies]
cfb = { workspace = true }
# Producer tests simulate a globally exhausted IME revision allocator through the engine's
# explicit test-support feature; production builds of this crate never enable it.
letra-engine = { workspace = true, features = ["test-support"] }
# kittest's own dev-dependencies do not propagate their font features. Declare the fonts the
# interface tests lay out explicitly: default faces plus monochrome emoji fallbacks.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
nodalia-zip = { workspace = true }
# #2726's regression test: the consumer the Windows adapter runs, fed with our updates.
# Pinned to the version egui already brings into the tree, so nothing is built twice.
accesskit_consumer = "=0.39.2"
