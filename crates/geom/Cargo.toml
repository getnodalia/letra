[package]
name = "letra-geom"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Letra geometry and units: points, twips, EMU, inches, centimetres; rectangles; measurement parsing"

[lints]
workspace = true

[features]
# Picture decoding within a memory budget (`picture`), for the crates that decode pictures.
image = ["dep:image", "dep:nodalia-image-codecs", "dep:nodalia-tiff"]

[dependencies]
nodalia-image-codecs = { workspace = true, optional = true }
nodalia-tiff = { workspace = true, optional = true }
image = { workspace = true, optional = true }
serde = { workspace = true }
