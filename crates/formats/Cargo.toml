[package]
name = "letra-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Letra import/export: plain text, Markdown, HTML, RTF, OpenDocument Text and LaTeX"

[lints]
workspace = true

[features]
# `sheet::xls_fixture`, the binary workbook builder other crates' tests share; turned on only as a
# dev-dependency, so never built into the app.
test-support = ["nodalia-xls/test-support"]

[dependencies]
letra-doc = { workspace = true }
letra-docx = { workspace = true }
nodalia-wordmodel = { workspace = true }
nodalia-rtf = { workspace = true }
nodalia-flow = { workspace = true }
nodalia-odf = { workspace = true }
nodalia-markdown = { workspace = true }
nodalia-html = { workspace = true }
nodalia-latex = { workspace = true }
nodalia-math = { workspace = true }
nodalia-mime = { workspace = true }
nodalia-sheet = { workspace = true }
nodalia-ods = { workspace = true }
nodalia-xls = { workspace = true }
nodalia-xlsx = { workspace = true }
nodalia-zip = { workspace = true }
letra-geom = { workspace = true, features = ["image"] }
nodalia-metafile = { workspace = true }
encoding_rs = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
# Password-protected ODT (ODF 1.3 Part 2 §3.4): AES-256-CBC, SHA-1/SHA-256, PBKDF2 (HMAC-SHA-1).
[dev-dependencies]
letra-doc = { workspace = true, features = ["test-support"] }
nodalia-image-codecs = { workspace = true }
proptest = { workspace = true }
chardetng = { workspace = true }
